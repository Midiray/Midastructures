    giga_blokkat2_randompostwave1:0 "Blokkat Eradicators Spawn Time: §LRandom§!\nThe Blokkat Eradicators will spawn anywhere between §Y10§! and §Y30 Years§! post the Blokkat-Vester's destruction. There is no way to know for sure!\n$blokkat2_spawn_warning$"
