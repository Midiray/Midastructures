    blokkat_beamfight_title_text:0 "§RClash of the Titans§!"
    blokkat_beamfight_desc_text:0 "We are using our Quasi-Stellar Obliterator to push back the Eradication Beam in a battle of gargantuan proportion. Losing it will mean the utter annihilation of the entire galaxy.\nIn this screen, we can track our current investment into this project compared to how much energy the Blokk-Eradicator is firing."
