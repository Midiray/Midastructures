    ### Events ###

    giga_blokkat_wave_2.100.name:0 "Project Salvation"
    giga_blokkat_wave_2.100.desc:0 "With the admittedly limited data given to us by the GIF Anchorage, we now know ships even more powerful than a Stellar Systemcraft are not out of reach. Every citizen of our nation will need to pour their blood, sweat and tears into this project; our one saving grace against the Blokkats' return, our species' salvation.\n\nAll that is left to do before we begin this project is to choose where to focus our efforts; we can only hope to unlock the secrets of one path."
    giga_blokkat_wave_2.100.singularitycraft:0  "A fleet of Singularitycraft will be able to take them on."
    giga_blokkat_wave_2.100.singularitybirch:0  "A Birch Singularitycraft shall duel the Eradicator alone."
    giga_blokkat_wave_2.100.quasarcraft:0       "The Gargantuan Quasarcraft can easily best the Blokkat menace."
    giga_blokkat_wave_2.100.menace:0            "Let us darken the stars with Menacing Celestials."
    giga_blokkat_wave_2.100.psionics:0          "We will commune with the entire galaxy to form The Avatar."
    giga_blokkat_wave_2.100.eotc:0              "The End of the Cycle shall assist us, at a cost."
    giga_blokkat_wave_2.100.biogenesis:0        "A truly biologically perfected navy shall be our salvation."
    giga_blokkat_wave_2.100.dotg:0              "We need only design a Paladin strong enough to defend us."
    giga_blokkat_wave_2.100.hack:0              "Why build our own, when we can hack theirs?"
    giga_blokkat_wave_2.100.cosmo:0             "An armada of weaponized Horizon Needles will prove victorious."
