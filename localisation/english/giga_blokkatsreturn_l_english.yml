    giga_blokkat2_very_easy:0 "The Blokkat Eradicators (§EBlokklets§!)\nThe Blokkats will be §Every debuffed§!.\n\nThey will receive the following effects:\n§Y-70% Weapons Damage\n-70% Ship Hull/Armor/Shield HP\n-50% Ship Speed\n-70% Army Damage/Heath/Morale§!\n\nThe §YBlokk-Eradicator§! will not revive, thus having a base total of §Y60 billion§! HP\nEnabling §YHyperdimensional Weaponry§! will have a base upkeep of §Y10k§! £energy£\nThe §YClash of the Titans§! will be §Y70%§! cheaper\n['concept_giga_blokkat2_rage'] will start at §Y250§! and scale §Y70%§! slower\n\n§HBalanced for usage with §YGigastructural Engineering & More§! as the only major mod and limited §YCelestial Warships§!."
    giga_blokkat2_easy:0 "The Blokkat Eradicators (§BBlokkittens§!)\nThe Blokkats will be §Bsomewhat debuffed§!.\n\nThey will receive the following effects:\n§Y-33% Weapons Damage\n-33% Ship Hull/Armor/Shield HP\n-33% Ship Speed\n-33% Army Damage/Heath/Morale§!\n\nThe §YBlokk-Eradicator§! will revive §Y1 time§!, thus having a base total of §Y120 billion§! HP\nEnabling §YHyperdimensional Weaponry§! will have a base upkeep of §Y20k§! £energy£\nThe §YClash of the Titans§! will be §Y33%§! cheaper\n['concept_giga_blokkat2_rage'] will start at §Y1250§! and scale §Y33%§! slower\n\n§HBalanced for usage with §YGigastructural Engineering & More§! as the only major mod."
    giga_blokkat2_normal:0 "The Blokkat Eradicators (§GRegular Blokkats§!)\nThe Blokkats will have their default strength.\n\nThe §YBlokk-Eradicator§! will revive §Y4 times§!, thus having a base total of §Y300 billion§! HP\nEnabling §YHyperdimensional Weaponry§! will have a base upkeep of §Y40k§! £energy£\n['concept_giga_blokkat2_rage'] will start at §Y2500§! and scale at §Yfull speed§!\n\n§HBalanced for usage with strong mods such as §YNew Ship Classes§! or §YExtra Ship Components§!.§!"
    giga_blokkat2_bismuth:0 "The Blokkat Eradicators (§RBismuth Blokkats§!)\nThe Blokkats will be §Rsignificantly stronger§!.\n\nThey will receive the following effects:\n§Y+200% Weapons Damage\n+200% Ship Fire Rate\n+200% Ship Hull/Armor/Shield HP\n+50% Ship Speed\n+50% Megastructure Build Speed\n+200% Army Damage/Health/Morale§!\n\nThe §YBlokk-Eradicator§! will revive §Y19 times§!, thus having a base total of §Y1.2 trillion§! HP\nEnabling §YHyperdimensional Weaponry§! will have a base upkeep of §Y75k§! £energy£\nThe §YClash of the Titans§! will be §Y50%§! more expensive\n['concept_giga_blokkat2_rage'] will start at §Y5000§! and scale §Y50%§! faster\n\n§HBalanced for usage with very powerful mods such as §YAncient Caches of Technologies§!.§!"
    giga_blokkat2_endtech:0 "The Blokkat Eradicators (§MEndtekk Blokkats§!)\nThe Blokkats will be §Mmassively stronger§!.\n\nThey will receive the following effects:\n§Y+1000% Weapons Damage\n+1000% Ship Fire Rate\n+2000% Ship Hull/Armor/Shield HP\n+90% Ship Speed\n+250% Megastructure Build Speed\n+1000% Army Damage/Health/Morale§!\n\nThe §YBlokk-Eradicator§! will revive §Y99 times§!, thus having a base total of §Y6 trillion§! HP\nEnabling §YHyperdimensional Weaponry§! will have a base upkeep of §Y500k§! £energy£\nThe §YClash of the Titans§! will be §Y200%§! more expensive\n['concept_giga_blokkat2_rage'] will start at §Y15000§! and scale §Y200%§! faster\n\n§HBALANCED FOR USAGE WITH TOO MANY POWERFUL MODS!"
    giga_blokkat2_deathmode:0 "The Blokkat Eradicators (§PObliterator Blokkats§!)\nThe Blokkats will be §PINFINITELY STRONGER§!.\n\nThey will receive the following effects:\n§Y+1000% Weapons Damage\n+1000% Ship Fire Rate\n+2000% Ship Hull/Armor/Shield HP\n+150% Ship Speed\n+600% Megastructure Build Speed\n+1000% Army Damage/Health/Morale§!\n\nThe §YBlokk-Eradicator§! will revive §Y999 times§!, thus having a base total of §Y60 trillion§! HP\nEnabling §YHyperdimensional Weaponry§! will have a base upkeep of §Y1000k§! £energy£\nThe §YClash of the Titans§! will be §Y500%§! more expensive\n['concept_giga_blokkat2_rage'] will start at §Y40000§! and scale §Y500%§! faster\nThe Blokkats will have multiple §RBlokk-Eradicators§! upon first arrival\n\n§H'BALANCED' FOR USAGE WITH UTTERLY OVERPOWERED MODS!"

