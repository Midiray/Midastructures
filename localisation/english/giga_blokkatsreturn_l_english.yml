    giga_dialog.6001.name:0 "Singularitycraft Construction Site Built"
    giga_dialog.6001.desc:0 "The construction site for our future $name_singularitycraft$ has now been completed! On this frame, we shall assemble the most potent warship ever conceived by the collective minds of this galaxy. Utilizing a captive singularity as both a thruster and power source, this vessel will be powerful enough to defend us from focused extragalactic threats.\n\n§RThe use of an UI Overhaul mod will be required for the Singularitycraft to properly display in the ship editor.§!"
    giga_dialog.6001.a:0 "It begins."

    giga_dialog.6002.name:0 "Singularitycraft Reality Manipulators Built"
    giga_dialog.6002.desc:0 "Our $name_singularitycraft$'s Reality Manipulators have been completed. These seemingly-small arms wrap around the singularity, forcing it down to size whilst manipulating its immense gravitational forces for both energy generation and movement."
    giga_dialog.6002.a:0 "Great."

    giga_dialog.6003.name:0 "Singularitycraft Planckalloy Plating Built"
    giga_dialog.6003.desc:0 ""
    giga_dialog.6003.a:0 "Another step."

    giga_dialog.6004.name:0 "Singularitycraft Ultima Obliterators Built"
    giga_dialog.6004.desc:0 ""
    giga_dialog.6004.a:0 "Getting close."

    giga_dialog.6005.name:0 "$name_singularitycraft$ Complete!"
    giga_dialog.6005.desc:0 "Finally. It is done. With this vessel, we shall begin to turn the tide of battle. Victory may not have slipped through our grasp quite yet."
    giga_dialog.6005.a:0 "Salvation at last."


