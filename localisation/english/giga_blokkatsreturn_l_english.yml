    concept_giga_blokkat2_rage:0 "§RGalactic Threat§!"
    concept_giga_blokkat2_rage_desc:0 "Indicates how much of a threat the Blokkats see you as, and thus how much energy they allocate to your destruction.\n\nIncreased by destroying Blokkat ships, beamfighting the Eradicator, and gaining support from the GIF.\n\nEach point of §RGalactic Threat§! increases Blokkat ship weapons damage, fire rate, and health by 0.1%.\n\nEach 1000 points of §RGalactic Threat§! gives all Blokkat military vessels an §Yextra life§!."

    giga_blokkat2_guaranteed:0 "The Blokkat Eradicators are §GGUARANTEED§! to spawn at roughly their designated date."
    giga_blokkat2_enabled:0 "The Blokkat Eradicators, a full military force of the Blokkats aiming to destroy the galaxy utterly, §GCAN§! spawn.\n\nThey will always spawn away from your capital."
    giga_blokkat2_disabled:0 "The Blokkat Eradicators will §RNOT§! spawn.\n\n§RNOTE: The Blokkats are designed as a singleplayer crisis and are thus disabled by default in Multiplayer. This is due to the fact they could spawn on top of a player's capital and because they are generally quite challenging. They can be enabled again but make sure every player knows the risks.§!"

    giga_blokkat2_randomgame:0 "Blokkat Eradicators Spawn Date: §LRandom§!\nThe Blokkat Eradicators will spawn anywhere between §Y2250§! and §Y100 Years§! past §YEndgame Date§!. There is no way to know for sure!\n$blokkat2_spawn_warning$"
    giga_blokkat2_lateendgame:0 "Blokkat Eradicators Spawn Date: §ELate Endgame§! (Default)\nThe Blokkat Eradicators can either spawn §Y100 Years§! after §YEndgame Date§! OR after §YAeternum§! or a §YCrisis§! has been defeated and §YEndgame Date§! has passed, whichever comes first.\n$blokkat2_spawn_warning$"
    giga_blokkat2_regularendgame:0 "Blokkat Eradicators Spawn Date: §GMid Endgame§!\nThe Blokkat Eradicators can spawn about §Y50 Years§! after §YEndgame Date§!.\n$blokkat2_spawn_warning$"
    giga_blokkat2_endgame:0 "Blokkat Eradicators Spawn Date: §YEndgame§!\nThe Blokkat Eradicators can spawn after §YEndgame Date§!.\n$blokkat2_spawn_warning$"
    giga_blokkat2_latemidgame:0 "Blokkat Eradicators Spawn Date: §HLate Midgame§!\nThe Blokkat Eradicators can spawn about §Y50 Years§! after §YMidgame Date§!.\n$blokkat2_spawn_warning$"
    giga_blokkat2_midgame:0 "Blokkat Eradicators Spawn Date: §SMidgame§!\nThe Blokkat Eradicators can spawn after §YMidgame Date§!.\n$blokkat2_spawn_warning$"
    giga_blokkat2_lateearlygame:0 "Blokkat Eradicators Spawn Date: §PLate Earlygame§!\nThe Blokkat Eradicators can spawn about §Y50 Years§! after §YGame Start§!.\n$blokkat2_spawn_warning$"
    giga_blokkat2_earlygame:0 "Blokkat Eradicators Spawn Date: §RGame Start§!\nThe Blokkat Eradicators can spawn right after §YGame Start§!.\n$blokkat2_spawn_warning$"

    giga_blokkat2_randompostwave1:0 "Blokkat Eradicators Spawn Time: §LRandom§!\nThe Blokkat Eradicators will spawn anywhere between §Y10§! and §Y30 Years§! post the Blokkat-Vester's destruction. There is no way to know for sure!\n$blokkat2_spawn_warning$"
    giga_blokkat2_30yrs:0 "Blokkat Eradicators Spawn Time: §GSlow§!\nThe Blokkat Eradicators can spawn §Y30 years§! after the Blokkat-Vester is defeated.\n$blokkat2_spawn_warning$"
    giga_blokkat2_20yrs:0 "Blokkat Eradicators Spawn Time: §YRegular§!\nThe Blokkat Eradicators can spawn §Y20 years§! after the Blokkat-Vester is defeated.\n$blokkat2_spawn_warning$"
    giga_blokkat2_10yrs:0 "Blokkat Eradicators Spawn Time: §RFast§!\nThe Blokkat Eradicators can spawn §Y10 years§! after the Blokkat-Vester is defeated.\n$blokkat2_spawn_warning$"

    blokkat2_spawn_warning:0 "\n§YSet the Blokkat Eradicators to §GGuaranteed§! if you want to ensure they spawn at this date§!\n\n§GClick to change Blokkat Spawn Date§!"

    giga_menu_blokkat2_section_desc: "The Blokkat Eradicators are a fully militarized intergalactic force come to destroy the galaxy utterly.\n\nIf the Blokkat Harvesters are enabled, the Eradicators' spawn chain will be tied to the Blokkat-Vester's defeat.\n\nThis section controls their settings. Below lists the effects of each difficulty setting.\n - ['concept_giga_blokkat2_diff_very_easy']\n - ['concept_giga_blokkat2_diff_easy']\n - ['concept_giga_blokkat2_diff_normal']\n - ['concept_giga_blokkat2_diff_bismuth']\n - ['concept_giga_blokkat2_diff_endtech']\n - ['concept_giga_blokkat2_diff_deathmode']"
