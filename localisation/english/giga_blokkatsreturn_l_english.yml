    BLOKKAT2_COUNTRY:0 "Extragalactic Invaders"
    BLOKKAT2_COUNTRY_DESC:0 "The Blokkats are an intergalactic civilization hellbent on the absolute destruction of our galaxy before we can pose further threat."

    ERADICATOR_BEAM_BLOKKAT:0 "Eradication Beam"
    ERADICATOR_BEAM_BLOKKAT_DESC:0 "You exist because we allow it, and §Ryou will end because we demand it.§!"
    SHIP_AURA_BLOKKAT_ERADICATOR:0 "Blokk-Eradicator Hyperdimensional Bulwark"
    SHIP_AURA_BLOKKAT_ERADICATOR_DESC:0 "The Blokk-Eradicator possesses its own hyperdimensional shield which drastically reduces the damage taken by both itself and other Blokkat vessels in the vicinity."
    COMBAT_COMPUTER_ERADICATOR_BLOKKAT:0 "Blokk-Eradicator Central Command"
    COMBAT_COMPUTER_ERADICATOR_BLOKKAT_DESC:0 "Unlike most ships employed by the Blokkats in their harvesting operations, the Blokk-Eradicator is a proper vessel of war designed for the utter destruction of entire galaxies."
    NAME_GIF_Enclave_Station:0 "GIF Intergalactic Coordination Anchorage"
    NAME_GIF_enclave_system:0 "GIF Anchorage"
    NAME_GIF:0 "The Grand Intergalactic Federation"
    NAME_GIF_adj:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.100.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.100.desc:0 "You have reached the GIF Intergalactic Coordination Anchorage. How may we assist you today?"
    giga_GIF_enclaves.100.a:0 "We would like to officially enter the GIF."
    giga_GIF_enclaves.100.a_tt:0 "This will §Ydrastically increase§! our GIF integration level, and we will lose some of our resources and sovereignty.\n\nIn return, the GIF will provide far more assistance to us technologically, economically, and militarily."
    giga_GIF_conquer_galaxy_tt:0 "The GIF requires prospecting civilizations to hold absolute control over their galaxy. Conquer 95% of the galaxy's solar systems to gain access."
    giga_GIF_enclaves.100.b:0 "We would like to sign military cooperation agreements."
    giga_GIF_enclaves.100.b_tt:0 ""
    giga_GIF_enclaves.100.c:0 ""
    giga_GIF_enclaves.100.d:0 ""
    giga_GIF_enclaves.100.e:0 ""
    giga_GIF_enclaves.100.f:0 "Are we ready to take on a Blokk-Eradicator?"
    giga_GIF_enclaves.100.exit:0 "Nevermind."
    giga_GIF_enclaves.101.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.101.desc:0 "Wonderful news! In that case, we shall be able to provide far greater support, with the same stipulations placed on all other member states.\n\nThese stipulations include a standing intergalactic research agreement including the surrender of all Blokkat scrap for joint study, a 15% resource contribution towards the shared pool of all GIF resources, and significant political integration with GIF standards.\n\nIn return, you shall be able to call on far more aid during Blokkat invasions, and gain the full benefit of the technological agreements in return.\n\nPerhaps one day you shall be able to construct your own Singularitycraft, and assist in extragalactic operations."
    giga_GIF_enclaves.101.a:0 "Wonderful."
    giga_GIF_enclaves.101.b:0 "On second thoughts, never mind."
    giga_GIF_enclaves.102.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.102.desc:0 "Ah, brilliant! These agreements will allow us to provide limited support in the form of USTF task forces on request, and expand the range of options you have available for your backing."
    giga_GIF_enclaves.102.a:0 "Wonderful."
    giga_GIF_enclaves.102.b:0 "On second thoughts, never mind."
    giga_GIF_enclaves.200.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.200.no:0 "No. Your best option at the moment would be to prepare for a galactic evacuation, and pray they do not follow."
    giga_GIF_enclaves.200.qso:0 "Your Quasi-Stellar Obliterator may be able to hold off the Blokk-Eradicator's beam, as long as you feed it enough energy."
    giga_GIF_enclaves.200.flagship:0 "You, somehow, appear to have created a vessel capable of going toe-to-toe with a Blokk-Eradicator. Use it wisely, and it may bring you victory."
    giga_GIF_enclaves.200.bulwark:0 "Your species is held in high regard in the GIF; if you so desire, you could nominate yourself as our next §YBulwark Galaxy§!, with the full support of the GIF behind you."
    giga_GIF_enclaves.200.a:0 "Could you help us design vessels able to take it on?"
    giga_GIF_enclaves.201.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.201.desc:0 "We can give you some pointers, that is all."
    giga_GIF_enclaves.201.a:0 "That's all we need."
