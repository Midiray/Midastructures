    concept_giga_blokkat2_rage:0 "§RGalactic Threat§!"
    concept_giga_blokkat2_rage_desc:0 "Indicates how much of a threat the Blokkats see you as, and thus how much energy they allocate to your destruction.\n\nIncreased by destroying Blokkat ships, beamfighting the Eradicator, and gaining support from the GIF.\n\nEach point of §RGalactic Threat§! increases Blokkat ship weapons damage, fire rate, and health by 0.1%."

    blokkat_eradicator_threat_modifier:0 "§RGalactic Threat§!"

    giga_blokkat2_guaranteed:0 "The Blokkat Eradicators are §GGUARANTEED§! to spawn at roughly their designated date."
    giga_blokkat2_enabled:0 "The Blokkat Eradicators, a full military force of the Blokkats aiming to destroy the galaxy utterly, §GCAN§! spawn.\n\nThey will always spawn away from your capital."
    giga_blokkat2_disabled:0 "The Blokkat Eradicators will §RNOT§! spawn.\n\n§RNOTE: The Blokkats are designed as a singleplayer crisis and are thus disabled by default in Multiplayer. This is due to the fact they could spawn on top of a player's capital and because they are generally quite challenging. They can be enabled again but make sure every player knows the risks.§!"

    giga_blokkat2_randomgame:0 "Blokkat Eradicators Spawn Date: §LRandom§!\nThe Blokkat Eradicators will spawn anywhere between §Y2250§! and §Y100 Years§! past §YEndgame Date§!. There is no way to know for sure!\n$blokkat2_spawn_warning$"
    giga_blokkat2_lateendgame:0 "Blokkat Eradicators Spawn Date: §ELate Endgame§! (Default)\nThe Blokkat Eradicators can either spawn §Y100 Years§! after §YEndgame Date§! OR after §YAeternum§! or a §YCrisis§! has been defeated and §YEndgame Date§! has passed, whichever comes first.\n$blokkat2_spawn_warning$"
