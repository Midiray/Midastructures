l_english:
###AHA WAVE TWO IS HERE FINALLY
    giga_blokkat_wave_2.999.name:0 "A Strange Visitor"
    giga_blokkat_wave_2.999.desc:0 "A strange, imposing formation of three spacecraft has appeared on the edge of the galaxy. They, clearly, possess weapons far beyond our own, yet have made no moves to fire on our approach.\n\nYet as we close in on the formation, we have information, seemingly, inserted directly into our consciousness."
    giga_blokkat_wave_2.999.a:0 "What could they have to say?"
    giga_blokkat_wave_2.1000.name:0 "The Grand Intergalactic Federation"
    giga_blokkat_wave_2.1000.desc:0 "Greetings, emerging civilizations of this galaxy! We would like to congratulate you on your defeat of the initial Blokkat harvesting operations. Monogalactic civilizations capable of driving back a Blokkat-Vester are rare in this corner of the universe.\n\nOh, but where have my manners gone?! I am §YRayne§!, Lyuinite and Universal Admiral of the §YUniversal Salvation Task Force§!, under the §YGrand Intergalactic Federation§!.\n\nThe Federation has sent me to offer you a place at our very, very large table, and unite yet more species in our common struggle against the Blokkat menace!\n\nAll we ask for is a small resource tax of 10%, standard across all members of the GIF including ourself. In return, we shall gift you with the blueprints to construct your own Singularitycraft- the warships we stand on- and blueprints for the necessary infrastructure and production for said crafts.\n\nTrust me, when the Blokkats come back for you, you'll need them.."
    giga_blokkat_wave_2.1000.a:0 "We accept this deal."
    giga_blokkat_wave_2.1000.b:0 "Psh, that was a cakewalk. We can handle this on our own."
    giga_blokkat_wave_2.1000.c:0 "Lying xeno scum! Die!"
    giga_blokkat_wave_2.1001.name:0 "The Grand Intergalactic Federation"
    giga_blokkat_wave_2.1001.desc:0 "Wonderful! The blueprints will be transferred in a moment's notice! We shall leave this token force under your control as a gesture of goodwill.\n\nUnfortunately, I must now depart to oversee another battle on the other end of the universe. Best of luck!"
    giga_blokkat_wave_2.1001.a:0 "Fight well!"
    giga_blokkat_wave_2.1002.name:0 "The Grand Intergalactic Federation"
    giga_blokkat_wave_2.1002.desc:0 "Unfortunate.. Well, in that case, no time to waste. Enjoy the next few decades, they are certain to be your last!"
    giga_blokkat_wave_2.1002.a:0 "Ominous.."
    giga_blokkat_wave_2.1003.name:0 "The Grand Intergalactic Federation"
    giga_blokkat_wave_2.1003.desc:0 "Disappointing. I had expected a civilization capable of destroying a Blokkat-Vester to be able to hold a civil conversation, but alas. Your galaxy is well-suited to become a bulwark to break the back of the Blokkats, and I will not have a misguided species gift the Blokkats more energy."
    giga_blokkat_wave_2.1003.a:0 "Battlestations!"
    situation_gif_blueprint_research_effect:0 "We will unlock new GIF technologies."
