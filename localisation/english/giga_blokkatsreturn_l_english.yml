    giga_blokkat_wave_2.2000.name:0 "Return of the Blokkats"
    giga_blokkat_wave_2.2000.desc:0 "§G<<CONFIRMING GALACTIC COORDINATES: CE-1461>>\n\n<<GALACTIC COORDINATES CONFIRMED CORRECT>>§!\n\n§R<<LOCAL CIVILIZATIONS DEEMED HAZARDOUS>>\n\n<<BLOKKAT-VESTER UNIT XP10 DESTROYED>>\n\n<<HARVEST STAGE 2 SKIPPED: HIGH PROXIMITY TO HARVESTING FIELD>>\n\n<<THREAT STATUS: PRIORITY>>\n\n<<ERADICATOR DEPLOYED>>\n\n<<COMMUNICATION PROTOCOLS DISABLED>>\n\n<<STERILIZATION PROTOCOLS ENABLED>>\n\n<<ERADICATION PROTOCOLS ENABLED>>§!"
    giga_blokkat_wave_2.2000.a:0 "Oh no.."
    giga_blokkat_wave_2.2001.name:0 "Existential Threat"
    giga_blokkat_wave_2.2001.desc:0 "The emergence of the Blokk-Eradicator in our galaxy set us on high alert. Strangely, even as the majority of its escorting forces moved to attack, the Eradicator itself remained unnervingly still.\n\nNow, we understand why. It has been charging up a beam of immense strength, and is now unleashing its fury at the exact center of mass of the galaxy in an attempt to utterly destroy it.\n\nLocal observation has noted energetic fluctuations, consistent with the known spontaneous decay phenomenon of high-magnitude lasers. Unfortunately for our galaxy, the phenomenon has been enhanced by Blokkat artificial particles known as Blokkitons.\n\nIf critical mass is reached, a §Rcataclysmic explosion§! will cascade violently across the galaxy, reducing it to less than space dust. Study of the fluctuation's increasing speed indicates a time of approximately 10 years before galactic destruction becomes possible.\n\nWe must decide our main approach, as the shield of the galaxy from eradication."
    giga_blokkat_wave_2.2001.a:0 "Our newly-improved Quasi-Stellar Obliterator shall overpower its beam!"
    giga_blokkat_wave_2.2001.b:0 "It can't shoot us if it's a pile of scrap. Blow it to kingdom come."
    giga_blokkat_wave_2.2001.c:0 "The GIF has mentioned Bulwark Galaxies, perhaps we could petition to become one?"
    giga_blokkat_wave_2.2001.d:0 "We must leave this galaxy in search of a more hospitable place."
    giga_blokkat_wave_2.2001.a_tt:0 "We will attempt to §Ybeamfight§! the Blokk-Eradicator using our upgraded Quasi-Stellar Obliterator.\n\nThis will need an increasing amount of energy the longer we wish to survive, and we will still need to face the Blokkat 'sterilization forces' in direct combat."
    giga_blokkat_wave_2.2001.b_tt:0 "We will attempt to §Ydestroy§! the Blokk-Eradicator, and possibly gain useful salvage from its scrap.\n\n§YThe Blokk-Eradicator is an immensely powerful vessel of war.§! If we manage to destroy it, the Blokkats will see us as a §Rmajor threat§! and massively increase the forces sent our way."
    giga_blokkat_wave_2.2001.c_tt:0 "We will attempt to convince the GIF to lend support to us.\n\nIf successful, petitioning aid will be much easier, and we will be assisted in our research of the fabled §YMaginot Birch World§!."
    giga_blokkat_wave_2.2001.d_tt:0 "We will attempt to §Yabandon§! this galaxy, taking ourselves and any chosen other civilizations to a better place.\n\n§RThe Blokkats have warned us that evacuation is not permitted, so we are likely to be chased until we reach support in GIF space.§!"
    giga_blokkat_flavoring.3.name:0 "Eradicator Down"
    giga_blokkat_flavoring.3.normal:0 "§R<<BLOKK-ERADICATOR LOST>>\n\n<<THREAT STATUS: EXTREME>>\n\n<<PRIORITY REINFORCEMENTS INBOUND>>\n\n<<SYSTEM CE-1461-M1D MARKED PRIORITY TARGET>>§!"
    giga_blokkat_flavoring.3.hacked:0 "§R<<BLOKK-ERADICATOR SYSTEM CONTROL LOST>>\n\n<<THREAT STATUS: CRITICAL>>\n\n<<PRIORITY REINFORCEMENTS INBOUND>>\n\n<<SYSTEM CE-1461-M1D MARKED PRIORITY TARGET>>§!"
    giga_blokkat_flavoring.3.a:0 "That doesn't sound good."
    giga_blokkat_flavoring.5.name:0 "Blokk-Emergency"
    giga_blokkat_flavoring.5.desc:0 "§R<<MULTIPLE MILITARY DETACHMENTS LOST>>\n\n<<THREAT STATUS: CRITICAL>>\n\n<<SEVERAL ERADICATOR FLEETS DISPATCHED>>\n\n<<ALL NEARBY MILITARY DETACHMENTS REDIRECTED>>\n\n<<GALAXY STERILIZATION GIVEN PRIORITY BLOKKWORK ACCESS>>\n\n<<HARVESTING FIELD DIVERGING>>§!"
    giga_blokkat_flavoring.5.a:0 "The storm worsens..."
    #MIDIRAY_CHANGE_THIS
    giga_blokkat_flavoring.10.name:0 ""
    giga_blokkat_flavoring.10.desc:0 "§R<<EXTENSIVE MILITARY ASSETS LOST>>\n\n<<SEVERAL ERADICATOR FLEETS DISPATCHED>>\n\n<<ALL NEARBY MILITARY DETACHMENTS REDIRECTED>>\n\n<<GALAXY STERILIZATION GIVEN PRIORITY BLOKKWORK ACCESS>>\n\n<<HARVESTING FIELD DIVERGING>>§!"
    giga_blokkat_flavoring.10.a:0 "The storm worsens..."

    blokkat_threat_name:0 "§RGalactic Threat§!"

    blokkat_threat_desc:0 "§RGalactic Threat§! represents the threat level which the Blokkats currently place us at. It will only go up over time as we incur further wrath of the intergalactic stripminers."

