    giga_menu_blokkat2_section_desc:0 "The Blokkat Eradicators are a fully militarized intergalactic force come to destroy the galaxy utterly.\n\nIf the Blokkat Harvesters are enabled, the Eradicators' spawn chain will be tied to the Blokkat-Vester's defeat.\n\nThis section controls their settings. Below lists the effects of each difficulty setting.\n - ['concept_giga_blokkat2_diff_very_easy']\n - ['concept_giga_blokkat2_diff_easy']\n - ['concept_giga_blokkat2_diff_normal']\n - ['concept_giga_blokkat2_diff_bismuth']\n - ['concept_giga_blokkat2_diff_endtech']\n - ['concept_giga_blokkat2_diff_deathmode']"

