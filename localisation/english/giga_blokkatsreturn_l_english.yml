    giga_GIF_enclaves.10.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.10.desc:0 ""
    giga_GIF_enclaves.10.a:0 "We accept this deal."
    giga_GIF_enclaves.11.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.11.desc:0 "winter is coming"
    giga_GIF_enclaves.11.a:0 "We drove the Blokkats away before, we can do it again!"
    giga_GIF_enclaves.11.b:0 "Preposterous. We have driven away threats of such degree before."
    giga_GIF_enclaves.12.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.12.desc.bothwave:0 "You misunderstand. The last Blokkat fleet was a simple mining expedition.\n\nWith its destruction, you have painted a target on your back, and the Blokkat military is all too happy to oblige.\n\nResisting a true Blokkat military incursion on your own is a nigh-impossible task, and as such we urge you to take what information we can give, and put it to use with the utmost of haste."
    giga_GIF_enclaves.12.desc.wave2only:0 "You misunderstand. The threats you have previously repelled, though strong, are a mere speck compared to the might of the Blokkat military.\n\nUnescorted Blokkat mining expeditions are capable of destroying approximately §R99.99%§! of monogalactic civilizations. With proper escorts, only a few anomalous galaxies throughout a supercluster would stand the minutest of chances.\n\nResisting a true Blokkat military incursion on your own is a nigh-impossible task, and as such we urge you to take what information we can give, and put it to use with the utmost of haste."
    giga_GIF_enclaves.intro.naval:0 "Is it possible to engage them in direct combat?"
    giga_GIF_enclaves.intro.shield:0 "Could we perhaps shield ourself from them?"
    giga_GIF_enclaves.intro.leave:0 "Is the galaxy worth fighting for, in the face of such impossible odds?"
    giga_GIF_enclaves.intro.beg:0 "Why can you only give us information? We need resources!"
    giga_GIF_enclaves.intro.goodbye:0 "Is it possible to engage them in direct combat?"
    giga_GIF_enclaves.13.desc.has_quasarcraft:0 "Your 'Gargantuan Quasarcraft', as you call it, is a ship which may even be capable of besting the Blokkat flagship."
    giga_GIF_enclaves.13.desc.is_lame:0 "Your vessels as they stand would struggle against the mere line warships of the Blokkat military, let alone their flagship.\n\nBlokkats have a technological mastery to a degree that the warships employed by typical monogalactic civilizations simply do not have the weapon capacity to significantly damage them.\n\nThough we cannot give you much data - we can't go giving out our technology to everyone! - we can give you some scientific paths to explore, and you can take it from there."
    giga_GIF_enclaves.17.a.tooltip:0 "We can now contact the §YBlokkat Emergency Bureau§! using the "Peruse Blokkat Eradicator Knowledge" button at the bottom left of the screen."

    GIGA_BLOKKAT_TARGETED_TITLE:0 "Blokkat Fleet Incoming"
    GIGA_BLOKKAT_TARGETED_DESC:0 "A §RBlokkat Fleet§! is heading towards §Y$SYSTEM$§!."

