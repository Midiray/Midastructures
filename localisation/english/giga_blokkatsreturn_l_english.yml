    giga_GIF_enclaves.10.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.10.desc:0 ""
    giga_GIF_enclaves.10.a:0 "We accept this deal."
    giga_GIF_enclaves.11.name:0 "The Grand Intergalactic Federation"
    giga_GIF_enclaves.11.desc:0 "winter is coming"
    giga_GIF_enclaves.11.a:0 "Thank you for the warning."
    giga_GIF_enclaves.11.b:0 "They will be no match for us."
    giga_blokkat_wave_2.100.name:0 "Project Salvation"
    giga_blokkat_wave_2.100.desc:0 "With the admittedly limited data given to us by the GIF Anchorage, we now know ships even more powerful than a Stellar Systemcraft are not out of reach. Every citizen of our nation will need to pour their blood, sweat and tears into this project; our one saving grace against the Blokkats' return, our species' salvation.\n\nAll that is left to do before we begin this project is to choose where to focus our efforts; we can only hope to unlock the secrets of one path."
    giga_blokkat_wave_2.100.singularityfleet:0 "The GIF has seen success with fleets of Singularitycraft; we should make our own."
    giga_blokkat_wave_2.100.singularitycraft:0 "We must make one gargantuan Singularitycraft, capable of fighting the Eradicator alone."
    giga_blokkat_wave_2.100.quasarcraft:0 "A Quasarcraft, improved with GIF tech, would be able to take on the entire Blokkat fleet."
    giga_blokkat_wave_2.100.menace:0 "Let us darken the stars with Menacing Celestials."
    giga_blokkat_wave_2.100.psionics:0 "We must combine the psionic effort of this entire galaxy into one avatar."
    giga_blokkat_wave_2.100.eotc:0 "The End of the Cycle shall assist us, at a cost."
    giga_blokkat_wave_2.100.biogenesis:0 "Let us design a navy that is truly biologically perfected."
    giga_blokkat_wave_2.100.dotg:0 "We need only design a Paladin strong enough to face down this new threat."
    giga_blokkat_wave_2.100.hack:0 "Why build our own, when we can hack theirs?"

    GIGA_BLOKKAT_TARGETED_TITLE:0 "Blokkat Fleet Incoming"
    GIGA_BLOKKAT_TARGETED_DESC:0 "A §RBlokkat Fleet§! is heading towards §Y$SYSTEM$§!."